name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ctrlline
          MYSQL_USER: ctrlline
          MYSQL_PASSWORD: ctrlline
        # 내부 네트워크에서만 접근하므로 포트 매핑 생략
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          
    env:
      # application-prod.yaml에 매핑
      DB_URL: jdbc:mariadb://mariadb:3306/ctrlline
      DB_USERNAME: ctrlline
      DB_PASSWORD: ctrlline
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ACCESS_TOKEN_EXPIRED: 3600000
      ACCESS_TOKEN_SECRET: myAccessSecretcessSecretcessSecretcessSecret
      REFRESH_TOKEN_EXPIRED: 86400000
      REFRESH_TOKEN_SECRET: myRefreshSecretcessSecretcessSecretcessSecret
      CORS_ALLOWED_ORIGINS: https://my-frontend.com
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
    steps:
      # 1️⃣ 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ Gradlew 실행 권한
      - name: Grant execute permission for Gradlew
        run: chmod +x CtrlLine/gradlew

      # 5️⃣ DB 준비 대기
      - name: Wait for MariaDB ready
        run: |
          echo "Waiting for MariaDB to be ready..."
          for i in {1..30}; do
            if docker exec $(docker ps -q -f name=mariadb) mysqladmin ping -h "mariadb" --silent; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Waiting..."
            sleep 3
          done

      # 6️⃣ Build & Test
      - name: Build & run tests
        working-directory: CtrlLine
        run: ./gradlew clean build test --stacktrace -i -Dspring.profiles.active=prod

      # 7️⃣ SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: CtrlLine
          hostUrl: ${{ secrets.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
